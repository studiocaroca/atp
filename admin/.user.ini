; Raises PHP's default upload caps (2M/8M) just for the admin panel, so
; play videos (the existing ones run 9-14MB) and multi-photo uploads
; can actually get through. Scoped to this directory only via PHP's
; per-directory .user.ini support — doesn't affect the public site.
upload_max_filesize = 80M
post_max_size = 90M
max_execution_time = 120
